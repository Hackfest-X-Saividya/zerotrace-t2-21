# ZeroTrace Cryptographic Credentials & Demo Keys
# IMPORTANT: Use demo keys only for academic/testbed demonstration.
# DO NOT embed production private keys in this file.

crypto:
  root_key_id: "OEM_ROOT_2026"
  hmac_secret: "OEM_ROOT_2026_ZERO_TRUST_SECRET_KEY_!" # 32-byte demo HMAC key
  magic_byte: 0xA5
  default_golden_version: 1

scenarios:
  1:
    name: "Valid Signed OTA Update"
    description: "Authentic firmware v2 with valid HMAC-SHA256 signature and passing self-test flag."
    expected_severity: "LOW"
    action: "ACCEPTED"
  2:
    name: "MITM Tampered OTA Payload"
    description: "Tampered payload bytes in transit causing cryptographic HMAC mismatch."
    expected_severity: "CRITICAL"
    action: "REJECTED_CRYPTO_FAIL"
  3:
    name: "Firmware Rollback Attack"
    description: "Valid signature but firmware v0 is below current monotonic version counter."
    expected_severity: "CRITICAL"
    action: "REJECTED_DOWNGRADE"
  4:
    name: "Buggy Probationary Firmware"
    description: "Firmware passes HMAC but fails runtime self-test during probation period."
    expected_severity: "HIGH"
    action: "WATCHDOG_ROLLBACK"
  5:
    name: "Zero-Wear Key Sanitization"
    description: "Command to purge master HMAC key from NVS in under 1ms."
    expected_severity: "MEDIUM"
    action: "KEY_PURGED"
  6:
    name: "Voltage Fault Injection (VFI)"
    description: "8.5us GPIO pulse targeting Arduino INT0 to skip instruction and corrupt state."
    expected_severity: "HIGH"
    action: "SBFT_TRAP_RESET"
